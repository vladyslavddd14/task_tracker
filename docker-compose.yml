# Task Tracker: database, API and web (nginx) started with one command:
#   cp .env.example .env     (once, then set the secrets inside)
#   docker compose up --build
name: task-tracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasktracker}
      POSTGRES_USER: ${POSTGRES_USER:-tasktracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published on the loopback interface only, so api/web can also run locally during development.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-tasktracker};Username=${POSTGRES_USER:-tasktracker};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT__Secret:?Copy .env.example to .env and set JWT__Secret (at least 32 characters)}
      Jwt__ExpiresMinutes: ${JWT__ExpiresMinutes:-60}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    healthcheck:
      # The aspnet image has no curl, so the check opens a TCP connection with bash.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q 200
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  pgdata:
